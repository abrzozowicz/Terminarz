<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart Planner Pro v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #05060b; --bg-card: #111420; --accent-blue: #3b82f6;
            --text-main: #f8fafc; --text-dim: #94a3b8; --border: rgba(255,255,255,0.06);
            --radius: 20px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-body); color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif; padding: 15px; margin: 0; 
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent);
        }

        /* Responsywna Siatka */
        .app-container { 
            max-width: 1200px; margin: 0 auto; 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
        }

        @media (max-width: 850px) { 
            .app-container { grid-template-columns: 1fr; }
            .glass-card { min-height: auto !important; }
        }

        .glass-card { 
            background: var(--bg-card); border-radius: var(--radius); padding: 20px; 
            border: 1px solid var(--border); display: flex; flex-direction: column; 
            min-height: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h3 { margin: 0 0 15px 0; font-size: 1rem; color: var(--text-main); display: flex; align-items: center; gap: 10px; font-weight: 700; }
        h3 span { color: var(--accent-blue); }

        /* Kalendarz */
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-name { font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .day { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center; 
            border-radius: 12px; cursor: pointer; font-size: 0.85rem; 
            background: rgba(255,255,255,0.03); position: relative; transition: 0.2s; 
        }
        .day.selected { background: var(--accent-blue); font-weight: 800; color: #fff; transform: scale(1.05); z-index: 2; }
        .dot { width: 4px; height: 4px; background: #ef4444; border-radius: 50%; position: absolute; bottom: 5px; box-shadow: 0 0 5px #ef4444; }

        /* Formularz */
        .form-group { margin-bottom: 12px; }
        label { font-size: 0.7rem; color: var(--text-dim); margin-left: 5px; font-weight: 600; text-transform: uppercase; }
        input { 
            width: 100%; padding: 14px; margin-top: 5px; border-radius: 14px; 
            border: 1px solid var(--border); background: rgba(0,0,0,0.2); 
            color: #fff; font-family: inherit; font-size: 0.9rem;
        }
        .btn { 
            width: 100%; padding: 16px; border-radius: 14px; border: none; 
            background: linear-gradient(135deg, #3b82f6, #2563eb); 
            color: #fff; font-weight: 800; cursor: pointer; margin-top: 10px; 
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        /* Listy */
        .list-container { overflow-y: auto; flex-grow: 1; margin-top: 5px; max-height: 320px; padding-right: 5px; }
        .event-item { 
            background: rgba(255,255,255,0.04); padding: 14px; margin-bottom: 10px; 
            border-radius: 15px; display: flex; justify-content: space-between; 
            align-items: center; border: 1px solid var(--border);
        }
        
        /* Styl rozróżnienia miesięcy */
        .month-divider { 
            padding: 20px 10px 10px 10px; font-size: 0.75rem; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px;
        }
        .month-divider::after { content: ""; height: 1px; flex-grow: 1; background: var(--border); }

        /* Kolory akcentowe dla miesięcy (cykliczne) */
        .month-0 { color: #3b82f6; } .item-0 { border-left: 4px solid #3b82f6; }
        .month-1 { color: #10b981; } .item-1 { border-left: 4px solid #10b981; }
        .month-2 { color: #f59e0b; } .item-2 { border-left: 4px solid #f59e0b; }
        .month-3 { color: #ef4444; } .item-3 { border-left: 4px solid #ef4444; }
        .month-4 { color: #8b5cf6; } .item-4 { border-left: 4px solid #8b5cf6; }

        #loader { position: fixed; top: 15px; right: 15px; color: var(--accent-blue); display: none; font-weight: 800; font-size: 0.6rem; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--accent-blue); z-index: 1000; }
        .scroll-custom::-webkit-scrollbar { width: 3px; }
        .scroll-custom::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div id="loader">POBIERANIE DANYCH...</div>

<div class="app-container">
    <div class="glass-card">
        <div class="cal-header">
            <button onclick="changeMonth(-1)" style="background:none; border:none; color:#fff; cursor:pointer; font-size:1.2rem;">❮</button>
            <div id="monthYear" class="month-name"></div>
            <button onclick="changeMonth(1)" style="background:none; border:none; color:#fff; cursor:pointer; font-size:1.2rem;">❯</button>
        </div>
        <div class="cal-grid" id="calendar"></div>
    </div>

    <div class="glass-card">
        <h3><span>🎯</span> Nowe Wydarzenie</h3>
        <div class="form-group">
            <label>Kiedy:</label>
            <input type="date" id="fDate">
        </div>
        <div class="form-group">
            <label>Godzina:</label>
            <input type="time" id="fTime" value="18:00">
        </div>
        <div class="form-group">
            <label>Szczegóły:</label>
            <input type="text" id="fDesc" placeholder="Trening, Liga...">
        </div>
        <button id="saveBtn" class="btn" onclick="save()">ZAPISZ W CHMURZE</button>
    </div>

    <div class="glass-card">
        <h3><span>📅</span> Dzień: <span id="selLabel" style="margin-left:auto; color:var(--accent-blue)"></span></h3>
        <div id="dayList" class="list-container scroll-custom"></div>
    </div>

    <div class="glass-card">
        <h3><span>🚀</span> Nadchodzące</h3>
        <div id="upcomingList" class="list-container scroll-custom"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyn3_xD7N-mofYXVwNe0dLbFR088n3RKER82l0L0YhMQfdaXXjfaxB9wM3YePXeQgA4/exec";

    let db = [];
    let curViewDate = new Date();
    let curSelDate = new Date().toISOString().split('T')[0];

    async function load() {
        document.getElementById('loader').style.display = 'block';
        try {
            const r = await fetch(SCRIPT_URL + "?t=" + Date.now());
            const text = await r.text();
            const data = JSON.parse(text);
            db = data.map(x => ({ 
                id: x[0], 
                d: String(x[1]).split('T')[0], 
                t: String(x[2]).replace(/'/g, "").substring(0,5), 
                desc: x[3] 
            }));
            render();
        } catch(e) { console.log("Błąd synchronizacji"); }
        document.getElementById('loader').style.display = 'none';
    }

    async function save() {
        const desc = document.getElementById('fDesc').value;
        if(!desc) return alert("Wpisz opis!");
        const btn = document.getElementById('saveBtn');
        btn.disabled = true; btn.innerText = "PRZETWARZANIE...";

        const newEv = { id: Date.now(), d: document.getElementById('fDate').value, t: document.getElementById('fTime').value, desc: desc };
        db.push(newEv);
        render();

        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'save', events: db }) });
            document.getElementById('fDesc').value = "";
            btn.innerText = "GOTOWE!";
            setTimeout(() => { btn.disabled = false; btn.innerText = "ZAPISZ W CHMURZE"; }, 2000);
        } catch(e) { alert("Błąd zapisu!"); btn.disabled = false; }
    }

    function render() {
        // Kalendarz
        const cal = document.getElementById('calendar');
        cal.innerHTML = "";
        const y = curViewDate.getFullYear(), m = curViewDate.getMonth();
        document.getElementById('monthYear').innerText = curViewDate.toLocaleString('pl', { month: 'long', year: 'numeric' });

        const first = (new Date(y, m, 1).getDay() || 7) - 1;
        const last = new Date(y, m+1, 0).getDate();

        for(let i=0; i<first; i++) cal.innerHTML += `<div class="empty"></div>`;
        for(let i=1; i<=last; i++) {
            const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            const has = db.some(x => x.d === dStr);
            cal.innerHTML += `<div class="day ${dStr===curSelDate?'selected':''}" onclick="selectDay('${dStr}')">${i}${has?'<div class="dot"></div>':''}</div>`;
        }

        // Plan Dnia
        document.getElementById('selLabel').innerText = curSelDate;
        document.getElementById('dayList').innerHTML = db.filter(x => x.d === curSelDate).sort((a,b)=>a.t.localeCompare(b.t)).map(x => `
            <div class="event-item">
                <span style="font-size:0.9rem"><b>${x.t}</b> ${x.desc}</span>
                <button onclick="del(${x.id})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:1.1rem;">✕</button>
            </div>
        `).join('') || "<div style='color:var(--text-dim); text-align:center; margin-top:30px; font-size:0.8rem;'>Czysta karta na dziś.</div>";

        renderUpcoming();
    }

    function renderUpcoming() {
        const container = document.getElementById('upcomingList');
        const now = new Date().toISOString().split('T')[0];
        const future = db.filter(x => x.d >= now).sort((a, b) => a.d.localeCompare(b.d) || a.t.localeCompare(b.t));

        let html = "";
        let lastMonth = "";

        future.forEach(x => {
            const dateObj = new Date(x.d);
            const mNum = dateObj.getMonth();
            const monthLabel = dateObj.toLocaleString('pl', { month: 'long', year: 'numeric' });
            const colorClass = `month-${mNum % 5}`;
            const borderClass = `item-${mNum % 5}`;

            if (monthLabel !== lastMonth) {
                html += `<div class="month-divider ${colorClass}">${monthLabel}</div>`;
                lastMonth = monthLabel;
            }

            html += `
                <div class="event-item ${borderClass}">
                    <div style="display:flex; flex-direction:column; gap:2px;">
                        <span style="font-size:0.65rem; color:var(--text-dim); font-weight:700">${x.d}</span>
                        <span style="font-size:0.85rem"><b>${x.t}</b> ${x.desc}</span>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html || "<div style='color:var(--text-dim); text-align:center; margin-top:30px; font-size:0.8rem;'>Brak przyszłych planów.</div>";
    }

    function selectDay(d) { curSelDate = d; document.getElementById('fDate').value = d; render(); }
    function changeMonth(v) { curViewDate.setMonth(curViewDate.getMonth() + v); render(); }
    function del(id) { if(confirm("Usunąć?")) { db = db.filter(x => x.id !== id); render(); fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'save', events: db }) }); } }

    window.onload = () => { document.getElementById('fDate').value = curSelDate; load(); };
</script>
</body>
</html>
