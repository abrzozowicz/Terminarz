<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart Planner Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0a0b12; --bg-card: #151825; --accent-blue: #3b82f6;
            --text-main: #f8fafc; --text-dim: #8e96b3; --neumorphic: 0 10px 30px rgba(0,0,0,0.5);
        }
        body { background: var(--bg-body); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; margin: 0; }
        .app-container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .app-container { grid-template-columns: 1fr; } }
        .glass-card { background: var(--bg-card); border-radius: 20px; padding: 20px; box-shadow: var(--neumorphic); border: 1px solid rgba(255,255,255,0.05); }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; font-size: 0.9rem; background: rgba(255,255,255,0.02); position: relative; }
        .day.selected { background: var(--accent-blue); font-weight: bold; }
        .dot { width: 4px; height: 4px; background: #ef4444; border-radius: 50%; position: absolute; bottom: 4px; }
        input { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: none; background: #000; color: #fff; font-family: inherit; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--accent-blue); color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .event-item { background: rgba(255,255,255,0.05); padding: 10px; margin-top: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        #loader { position: fixed; top: 10px; right: 10px; color: var(--accent-blue); display: none; font-weight: bold; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="loader">SYNCHRONIZACJA...</div>

<div class="app-container">
    <div class="glass-card">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 15px;">
            <button onclick="changeMonth(-1)" style="background:none; border:none; color:#fff; cursor:pointer; padding:10px;">❮</button>
            <div id="monthYear" style="font-weight: 800; text-transform: uppercase; font-size: 0.9rem;"></div>
            <button onclick="changeMonth(1)" style="background:none; border:none; color:#fff; cursor:pointer; padding:10px;">❯</button>
        </div>
        <div class="cal-grid" id="calendar"></div>
    </div>

    <div class="glass-card">
        <h3 style="margin-top:0; font-size: 1.1rem; color: var(--accent-blue);">🎯 Nowy Wpis</h3>
        <input type="date" id="fDate">
        <input type="time" id="fTime" value="18:00">
        <input type="text" id="fDesc" placeholder="Co planujesz? (np. Trening)">
        <button id="saveBtn" class="btn" onclick="save()">ZAPISZ W ARKUSZU</button>
        <hr style="opacity: 0.1; margin: 20px 0;">
        <div id="dayList"></div>
    </div>
</div>

<script>
    // TWÓJ AKTUALNY LINK:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyn3_xD7N-mofYXVwNe0dLbFR088n3RKER82l0L0YhMQfdaXXjfaxB9wM3YePXeQgA4/exec";

    let db = [];
    let curViewDate = new Date();
    let curSelDate = new Date().toISOString().split('T')[0];

    async function load() {
        document.getElementById('loader').style.display = 'block';
        try {
            const r = await fetch(SCRIPT_URL + "?t=" + Date.now());
            const text = await r.text();
            const data = JSON.parse(text);
            db = data.map(x => ({ 
                id: x[0], 
                d: String(x[1]).split('T')[0], 
                t: String(x[2]).replace(/'/g, "").substring(0,5), 
                desc: x[3] 
            }));
            render();
        } catch(e) { console.log("Błąd ładowania danych"); }
        document.getElementById('loader').style.display = 'none';
    }

    async function save() {
        const desc = document.getElementById('fDesc').value;
        if(!desc) return alert("Podaj opis!");
        
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerText = "ZAPISYWANIE...";

        const newEv = { 
            id: Date.now(), 
            d: document.getElementById('fDate').value, 
            t: document.getElementById('fTime').value, 
            desc: desc 
        };
        
        db.push(newEv);
        render();

        try {
            await fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'save', events: db }) 
            });
            document.getElementById('fDesc').value = "";
            btn.innerText = "ZAPISANO!";
            setTimeout(() => { btn.disabled = false; btn.innerText = "ZAPISZ W ARKUSZU"; }, 2000);
        } catch(e) { alert("Błąd zapisu!"); btn.disabled = false; btn.innerText = "ZAPISZ W ARKUSZU"; }
    }

    function render() {
        const cal = document.getElementById('calendar');
        cal.innerHTML = "";
        const y = curViewDate.getFullYear(), m = curViewDate.getMonth();
        document.getElementById('monthYear').innerText = curViewDate.toLocaleString('pl', { month: 'long', year: 'numeric' });

        const first = (new Date(y, m, 1).getDay() || 7) - 1;
        const last = new Date(y, m+1, 0).getDate();

        for(let i=0; i<first; i++) cal.innerHTML += `<div></div>`;
        for(let i=1; i<=last; i++) {
            const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            const has = db.some(x => x.d.includes(dStr));
            cal.innerHTML += `<div class="day ${dStr===curSelDate?'selected':''}" onclick="selectDay('${dStr}')">${i}${has?'<div class="dot"></div>':''}</div>`;
        }

        document.getElementById('dayList').innerHTML = db.filter(x => x.d.includes(curSelDate)).sort((a,b)=>a.t.localeCompare(b.t)).map(x => `
            <div class="event-item">
                <span style="font-size: 0.9rem;"><b style="color:var(--accent-blue)">${x.t}</b> ${x.desc}</span>
                <button onclick="del(${x.id})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">✕</button>
            </div>
        `).join('') || "<div style='color:var(--text-dim); font-size:0.8rem;'>Brak wydarzeń na ten dzień.</div>";
    }

    function selectDay(d) { curSelDate = d; document.getElementById('fDate').value = d; render(); }
    function changeMonth(v) { curViewDate.setMonth(curViewDate.getMonth() + v); render(); }
    
    function del(id) { 
        if(confirm("Usunąć wpis?")) { 
            db = db.filter(x => x.id !== id); 
            render(); 
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'save', events: db }) }); 
        } 
    }

    window.onload = () => { document.getElementById('fDate').value = curSelDate; load(); };
</script>
</body>
</html>
